name: Enterprise Image

# Builds and publishes the enterprise deployment image referenced by
# dream-en's `deploy/docker-compose.yml` (`ghcr.io/gaogg521/dream-core-enterprise`).
# This image is not produced by any other workflow — `release.yml` and
# `build-manual.yml` only build the bare `dreamcore`/`aioncore` binaries for
# direct download, and their `docker pull ghcr.io/cross-rs/...` steps are
# unrelated cross-compilation toolchain images.
#
# The `enterprise` feature is baked into the Dockerfile itself (see its
# `cargo build --features enterprise` line), not passed as a build-arg here —
# this workflow does not need to (and must not) duplicate that choice.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gaogg521/dream-core-enterprise

jobs:
  build-and-push:
    name: Build and push enterprise image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
