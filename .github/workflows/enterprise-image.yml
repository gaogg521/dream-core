name: Enterprise Image

# Builds and publishes the enterprise deployment image referenced by
# dream-en's `deploy/docker-compose.yml` (`ghcr.io/gaogg521/dream-core-enterprise`).
# This image is not produced by any other workflow — `release.yml` and
# `build-manual.yml` only build the bare `dreamcore` binaries for
# direct download, and their `docker pull ghcr.io/cross-rs/...` steps are
# unrelated cross-compilation toolchain images.
#
# The `enterprise` feature is baked into the Dockerfile itself (see its
# `cargo build --features enterprise` line), not passed as a build-arg here —
# this workflow does not need to (and must not) duplicate that choice.
#
# Release tags made by release-please DO NOT run this. That workflow uses the
# default GITHUB_TOKEN, and GitHub does not let events created by it start other
# workflows: v0.1.72 through v0.1.79 produced no image. Only a tag pushed by a
# person, or a manual dispatch, does. Before cutting an offline bundle, dispatch
# it and wait for success:
#   gh workflow run enterprise-image.yml --ref main
# The full procedure and the checks that guard it: dream-en/deploy/OFFLINE-BUNDLE.md

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gaogg521/dream-core-enterprise

jobs:
  build-and-push:
    name: Build and push enterprise image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull by digest (not a tag — avoids any registry propagation race) and
      # run each binary's --help so a build that "succeeded" but produced a
      # broken/non-executable image fails the workflow instead of silently
      # publishing.
      - name: Smoke-test the pushed image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker run --rm --entrypoint ./dreamcore-admin "$image" --help
          docker run --rm --entrypoint ./dreamcore "$image" --help
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
