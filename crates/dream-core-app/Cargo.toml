[package]
name = "dream-core-app"
version.workspace = true
edition.workspace = true
exclude = ["data/**"]

[[bin]]
name = "dreamcore"
path = "src/main.rs"

[[bin]]
name = "dreamcore-admin"
path = "src/bin/admin.rs"
required-features = ["enterprise"]

[features]
default = ["telegram", "lark", "dingtalk", "weixin", "slack", "discord"]

# Enterprise governance plane. OFF by default: the personal edition must not
# ship the admin backend, and until this existed the only thing standing
# between a member and it was a client-side role check in the UI.
#
# Deliberately NOT gated here: `dream-domain-devops` and `dream-domain-employee`.
# Both are consumed by the personal edition (superAssistant's registries and
# digital employees), and devops' registry writes are legitimate in standalone
# mode — `require_registry_admin` returns Ok when there is no org at all. See
# dream-en's docs/roadmap.zh-CN.md for the per-route survey behind this split.
enterprise = [
    "dep:dream-domain-org",
    "dep:dream-domain-sso",
    "dep:dream-domain-enterprise",
    "dep:dream-domain-billing",
    "dep:dream-domain-platform",
]

telegram = ["dream-core-channel/telegram"]
lark = ["dream-core-channel/lark"]
dingtalk = ["dream-core-channel/dingtalk"]
weixin = ["dream-core-channel/weixin"]
slack = ["dream-core-channel/slack"]
discord = ["dream-core-channel/discord"]

[dependencies]
dream-core-common.workspace = true
dream-core-assets.workspace = true
dream-core-db.workspace = true
dream-core-api-types.workspace = true
dream-core-realtime.workspace = true
dream-core-process.workspace = true
dream-core-auth.workspace = true
dream-core-system.workspace = true
dream-core-file.workspace = true
dream-core-office.workspace = true
dream-core-shell.workspace = true
dream-core-ai-agent.workspace = true
dream-core-codex-bridge.workspace = true
dream-core-claude-bridge.workspace = true
dream-core-session.workspace = true
dream-core-mcp.workspace = true
dream-core-conversation.workspace = true
dream-core-extension.workspace = true
dream-core-channel.workspace = true
dream-core-team.workspace = true
dream-core-team-prompts.workspace = true
dream-core-cron.workspace = true
dream-core-project.workspace = true
dream-core-assistant.workspace = true
dream-core-runtime.workspace = true
dream-domain-org = { workspace = true, optional = true }
dream-domain-employee.workspace = true
dream-domain-sso = { workspace = true, optional = true }
dream-domain-devops.workspace = true
dream-domain-enterprise = { workspace = true, optional = true }
dream-domain-billing = { workspace = true, optional = true }
dream-domain-platform = { workspace = true, optional = true }
dream-engine-config.workspace = true
axum.workspace = true
chrono.workspace = true
dirs.workspace = true
dunce.workspace = true
tokio.workspace = true
uuid.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
rmcp = { version = "1.5", features = ["server", "transport-io", "schemars"] }
anyhow.workspace = true
async-trait.workspace = true
dashmap.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
dream-core-api-types.workspace = true
dream-core-realtime.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
dream-core-ai-agent = { workspace = true, features = ["test-support"] }
base64.workspace = true
git2.workspace = true
http-body-util.workspace = true
rust_xlsxwriter.workspace = true
sqlx = { workspace = true, features = ["migrate"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
wiremock = "0.6"
