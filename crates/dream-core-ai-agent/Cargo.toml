[package]
name = "dream-core-ai-agent"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
dream-core-auth.workspace = true
dream-core-common.workspace = true
dream-core-db.workspace = true
dream-core-mcp.workspace = true
dream-core-realtime.workspace = true
dream-core-runtime.workspace = true
dream-core-extension.workspace = true
dream-core-api-types.workspace = true
dream-core-team-prompts.workspace = true
dream-core-session.workspace = true
dream-core-process.workspace = true
dream-core-system.workspace = true
axum.workspace = true
http.workspace = true
base64.workspace = true
mime_guess.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
getrandom.workspace = true
regex.workspace = true
dashmap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
which.workspace = true
dream-engine-agent.workspace = true
dream-engine-providers.workspace = true
dream-engine-types.workspace = true
dream-engine-protocol.workspace = true
dream-engine-config.workspace = true
dream-engine-mcp.workspace = true
uuid.workspace = true
agent-client-protocol = { version = "2.0.0", features = ["unstable_session_fork", "unstable_end_turn_token_usage"] }
tokio-util = { version = "0.7", features = ["compat", "codec"] }
rusqlite.workspace = true
libc.workspace = true
fs2.workspace = true

[features]
# Enables the `AgentInstance::Mock` variant used by downstream test harnesses
# (conversation/cron/team/app) to inject trait-object stubs without having to
# spawn a real agent process. Production builds must NOT turn this on — it
# introduces a `dyn IAgentTask` branch that defeats the enum's zero-dispatch
# guarantee.
test-support = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true
dream-core-common.workspace = true
dream-core-extension.workspace = true
dream-core-db.workspace = true
dream-core-process.workspace = true
uuid.workspace = true
sqlx.workspace = true

# Integration tests under `tests/` need the `AgentInstance::Mock` variant.
# Unlike unit tests (which see `cfg(test)` on the library), integration
# tests compile as separate binaries and must opt in via a feature.
[[test]]
name = "agent_types_integration"
required-features = ["test-support"]
