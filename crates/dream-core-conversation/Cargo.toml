tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
dream-core-ai-agent = { workspace = true, features = ["test-support"] }
# Force-kill convergence tests (force_kill_convergence.rs) build a real
# `AgentInstance::Session` over a fake `SessionBackend`, so they need the session
# crate's trait + test doubles. Dev-only; never shipped.
dream-core-session = { workspace = true, features = ["test-support"] }
futures-util = { workspace = true }
async-trait.workspace = true
